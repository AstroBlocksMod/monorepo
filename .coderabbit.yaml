# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
reviews:
  auto_review:
    # Skip upstream sync PRs (.github/workflows/upstream-sync.yml). Their diff is
    # TurboWarp's code, which is not ours to review. Matched by label rather than
    # title: anyone can put sync-like wording in a title, but only people with
    # triage access can add labels.
    labels:
      - "!upstream-sync"
