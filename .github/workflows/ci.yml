name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Upstream sync PRs commit conflicts as git left them and list each one as an
  # "unresolved=" line in .github/upstream/<package>
  # (see .github/scripts/merge-upstream.sh). Fail until all are resolved.
  conflicts:
    name: unresolved conflicts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check for unresolved conflicts
        run: |
          status=0
          if grep -Hn '^unresolved=' .github/upstream/*; then
            echo "::error::An upstream sync left the conflicts above. Resolve each file, then delete its unresolved= line."
            status=1
          fi
          if git grep -nE '^(<<<<<<<|>>>>>>>)( |$)'; then
            echo "::error::Conflict markers found."
            status=1
          fi
          exit "$status"

  package:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: extensions
            filter: "@turbowarp/extensions"
            scripts: validate lint check-format build
          - name: scratch-blocks
            filter: scratch-blocks
            scripts: test:lint build
          - name: scratch-gui
            filter: scratch-gui
            scripts: test:lint build test:unit
          - name: scratch-paint
            filter: scratch-paint
            scripts: lint build test
          - name: scratch-render
            filter: scratch-render
            # The integration tests load scratch-vm's built bundle. scratch-vm is
            # not a dependency of scratch-render (scratch-vm depends on it, so that
            # would be a cycle), so build it here. "scratch-vm..." also selects
            # scratch-render, which pnpm then builds first.
            test_deps: scratch-vm...
            scripts: lint build tap
          - name: scratch-storage
            filter: "@turbowarp/scratch-storage"
            scripts: build test
          - name: scratch-vm
            filter: scratch-vm
            scripts: lint build tap

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pnpm
        # Version comes from "packageManager" in the root package.json.
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace dependencies
        # "<pkg>^..." is the dependencies of <pkg> without <pkg> itself, plus anything
        # the package's tests need (test_deps). Exits 0 when nothing is selected.
        run: |
          filters=(--filter "$FILTER^...")
          if [ -n "$TEST_DEPS" ]; then
            filters+=(--filter "$TEST_DEPS")
          fi
          pnpm "${filters[@]}" run build
        env:
          FILTER: ${{ matrix.filter }}
          TEST_DEPS: ${{ matrix.test_deps }}

      - name: Run package scripts
        run: |
          for script in $SCRIPTS; do
            echo "::group::pnpm --filter $FILTER run $script"
            pnpm --filter "$FILTER" run "$script"
            echo "::endgroup::"
          done
        env:
          FILTER: ${{ matrix.filter }}
          SCRIPTS: ${{ matrix.scripts }}
